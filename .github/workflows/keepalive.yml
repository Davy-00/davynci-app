name: Keep backend awake
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render backend
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 120 \
            https://davynci-backend.onrender.com/api/stream/status)
          echo "status endpoint -> $code"
          [ "$code" = "200" ] || exit 1
