services:
  - type: web
    name: davynci-backend
    runtime: python
    plan: free
    region: oregon
    rootDir: .
    buildCommand: pip install -r requirements-render.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/stream/status
    autoDeploy: true
    envVars:
      - key: OANDA_API_TOKEN
        sync: false
      - key: OANDA_ENV
        value: practice
      - key: OANDA_ACCOUNT_ID
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.6
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
